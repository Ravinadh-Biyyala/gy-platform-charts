{{- include "mnb.checkNamespace" . }}
{{- $name := include "mnb.name" . }}
# Shaped like the Mayan release's own mayan-app Deployment: one `app` label
# as the selector, and the configuration loaded whole with envFrom, from a
# ConfigMap and a Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The old pod serves until the new one is ready.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # envFrom is read only when a container starts, so a changed ConfigMap
        # must roll the pods: this checksum changes with it.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        # The image's own `node` user (uid 1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "mnb.configMapName" . }}
            - secretRef:
                name: {{ .Values.backend.secretName }}
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.backend.probes.startup | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
