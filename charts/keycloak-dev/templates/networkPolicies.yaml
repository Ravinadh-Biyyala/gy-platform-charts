{{- range $name, $o := .Values.networkPolicies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  {{- with $o.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $o.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $o.spec | nindent 2 }}
{{- end }}
