# keycloak-dev - DEV: namespace keycloak on the DEV cluster
# Recovered from the live namespace; reproduces it exactly (verify with kubectl diff).
# Secrets are NOT here - the pods read existing Secrets by name.
deployments:
  keycloak:
    spec:
      progressDeadlineSeconds: 600
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: keycloak
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: keycloak
        spec:
          containers:
            - args:
                - start-dev
              env:
                - name: KEYCLOAK_ADMIN
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-dev-credentials
                      key: KEYCLOAK_ADMIN
                - name: KEYCLOAK_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-dev-credentials
                      key: KEYCLOAK_ADMIN_PASSWORD
                - name: KC_DB
                  value: postgres
                - name: KC_DB_URL
                  value: jdbc:postgresql://postgres.postgres.svc.cluster.local:5432/keycloak
                - name: KC_DB_USERNAME
                  value: keycloak
                - name: KC_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-dev-credentials
                      key: KC_DB_PASSWORD
                - name: KC_PROXY_HEADERS
                  value: xforwarded
                - name: KC_HOSTNAME
                  value: keycloakdev.portal.gov.gy
                - name: KC_HOSTNAME_STRICT
                  value: 'false'
                - name: KC_HTTP_ENABLED
                  value: 'true'
              image: quay.io/keycloak/keycloak:26.2
              imagePullPolicy: IfNotPresent
              name: keycloak
              ports:
                - containerPort: 8080
                  protocol: TCP
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
ingresses:
  keycloak-ingress:
    spec:
      ingressClassName: kommander-traefik
      rules:
        - host: keycloakdev.portal.gov.gy
          http:
            paths:
              - backend:
                  service:
                    name: keycloak
                    port:
                      number: 8080
                path: /
                pathType: Prefix
networkPolicies:
  allow-traefik-to-keycloak:
    spec:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: nutanix-k-square-csknr-n8vl6
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: traefik
          ports:
            - port: 8080
              protocol: TCP
      podSelector:
        matchLabels:
          app: keycloak
      policyTypes:
        - Ingress
services:
  keycloak:
    spec:
      externalTrafficPolicy: Cluster
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - nodePort: 30178
          port: 8080
          protocol: TCP
          targetPort: 8080
      selector:
        app: keycloak
      sessionAffinity: None
      type: NodePort
