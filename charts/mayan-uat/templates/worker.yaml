apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayan-worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mayan-worker
  template:
    metadata:
      labels:
        app: mayan-worker
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: mayan-worker
          image: "{{ .Values.mayan.image.repository }}:{{ .Values.mayan.image.tag }}"
          imagePullPolicy: {{ .Values.mayan.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: mayan-config
            - secretRef:
                name: mayan-secrets
          ports: []
          volumeMounts:
            - name: media
              mountPath: /var/lib/mayan
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mayan-media
