# postgres-dev - DEV: namespace postgres on the DEV cluster
# Recovered from the live namespace; reproduces it exactly (verify with kubectl diff).
# Secrets are NOT here - the pods read existing Secrets by name.
deployments:
  postgres:
    spec:
      progressDeadlineSeconds: 600
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: postgres
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: postgres
        spec:
          containers:
            - env:
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      key: POSTGRES_DB
                      name: postgres-secret
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      key: POSTGRES_USER
                      name: postgres-secret
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: POSTGRES_PASSWORD
                      name: postgres-secret
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
              image: postgres:16
              imagePullPolicy: IfNotPresent
              name: postgres
              ports:
                - containerPort: 5432
                  protocol: TCP
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /var/lib/postgresql/data
                  name: postgres-storage
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
            - name: postgres-storage
              persistentVolumeClaim:
                claimName: postgres-pvc
persistentVolumeClaims:
  postgres-pvc:
    annotations:
      helm.sh/resource-policy: keep
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: nutanix-volume
      volumeMode: Filesystem
services:
  postgres:
    annotations:
      metallb.io/ip-allocated-from-pool: metallb
    spec:
      allocateLoadBalancerNodePorts: true
      externalTrafficPolicy: Cluster
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - nodePort: 31770
          port: 5432
          protocol: TCP
          targetPort: 5432
      selector:
        app: postgres
      sessionAffinity: None
      type: LoadBalancer
