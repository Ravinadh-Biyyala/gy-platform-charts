      APP_NAME: MPS Citizen Portal
      MFA_BASE: ''
      MFA_ENABLED: 'false'
      UPLOAD_MAX: 26m
  mps-frontend-config:
    data:
      API_BASE: /api
      API_UPSTREAM: http://mps-backend-service.react-mps-dev.svc.cluster.local:8081
      CITIZEN_PORTAL_URL: https://mpsdev.portal.gov.gy/citizen
      DMS_MAX_UPLOAD: 25m
deployments:
  mps-backend:
    labels:
      app: mps-backend
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: mps-backend
      strategy:
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps-backend
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-backend-config
                - secretRef:
                    name: mps-backend-secret
              image: ravinadh/ksquarenis:mps-backend211
              imagePullPolicy: Always
              name: mps-backend
              ports:
                - containerPort: 8081
                  protocol: TCP
              resources: {}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  mps-citizen-backend:
    labels:
      app: mps-citizen-backend
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: mps-citizen-backend
      strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps-citizen-backend
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-citizen-backend-config
                - secretRef:
                    name: mps-citizen-backend-secrets
              image: ravinadh/ksquarenis:mps-citizen-backend45
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 5
              name: mps-citizen-backend
              ports:
                - containerPort: 8081
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              startupProbe:
                failureThreshold: 36
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  mps-citizen:
    labels:
      app: mps-citizen
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: mps-citizen
      strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps-citizen
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-citizen-frontend-config
              image: ravinadh/ksquarenis:mps-citizen45
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /citizen/scholarships/
                  port: http
                  scheme: HTTP
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 3
              name: mps-citizen
              ports:
                - containerPort: 80
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /citizen/scholarships/
                  port: http
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  mps:
    labels:
      app: mps
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: mps
      strategy:
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-frontend-config
              image: ravinadh/ksquarenis:mps211
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 80
                  scheme: HTTP
                initialDelaySeconds: 30
                periodSeconds: 20
                successThreshold: 1
                timeoutSeconds: 5
              name: mps
              ports:
                - containerPort: 80
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 80
                  scheme: HTTP
                initialDelaySeconds: 10
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 250m
                  memory: 256Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
ingresses:
  mps-ingress:
    spec:
      ingressClassName: kommander-traefik
      rules:
        - host: mpsdev.portal.gov.gy
          http:
            paths:
              - backend:
                  service:
                    name: mps-citizen-service
                    port:
                      name: http
                path: /citizen
                pathType: Prefix
              - backend:
                  service:
                    name: mps-backend-service
                    port:
                      number: 80
                path: /health
                pathType: Exact
              - backend:
                  service:
                    name: mps-backend-service
                    port:
                      number: 80
                path: /api
                pathType: Prefix
              - backend:
                  service:
                    name: mps-service
                    port:
                      number: 80
                path: /
                pathType: Prefix
services:
  mps-backend-service:
    labels:
      app: mps-backend
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - port: 80
          protocol: TCP
          targetPort: 8081
      selector:
        app: mps-backend
      sessionAffinity: None
      type: ClusterIP
  mps-citizen-backend-service:
    labels:
      app: mps-citizen-backend
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 8081
          protocol: TCP
          targetPort: http
      selector:
        app: mps-citizen-backend
      sessionAffinity: None
      type: ClusterIP
  mps-citizen-service:
    labels:
      app: mps-citizen
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: http
      selector:
        app: mps-citizen
      sessionAffinity: None
      type: ClusterIP
  mps-service:
    labels:
      app: mps-frontend
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 80
      selector:
        app: mps
      sessionAffinity: None
      type: ClusterIP
