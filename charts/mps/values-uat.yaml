# mps - UAT: namespace react-mps-uat on the UAT cluster
# Recovered from the live namespace; reproduces it exactly (verify with kubectl diff).
# Secrets are NOT here - the pods read existing Secrets by name.
# Not managed here: persistentvolumeclaim-postgres-data-mps-postgres-0, persistentvolumeclaim-postgres-data-mps-postgres-test-0
