deployments:
  mps-backend:
    labels:
      app: mps-backend
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: mps-backend
      strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps-backend
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-backend-secret
                - secretRef:
                    name: mps-backend-secret
              image: ravinadh/mps-uat-backend:mps-backend-uat68
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 6
                httpGet:
                  path: /health
                  port: 8081
                  scheme: HTTP
                periodSeconds: 20
                successThreshold: 1
                timeoutSeconds: 5
              name: mps-backend
              ports:
                - containerPort: 8081
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: 8081
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: '1'
                  memory: 1Gi
                requests:
                  cpu: 250m
                  memory: 512Mi
              startupProbe:
                failureThreshold: 60
                httpGet:
                  path: /health
                  port: 8081
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  mps-citizen-backend:
    labels:
      app: mps-citizen-backend
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: mps-citizen-backend
      strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps-citizen-backend
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-citizen-backend-config
                - secretRef:
                    name: mps-citizen-backend-secrets
              image: ravinadh/mps-uat-backend:citizen-backend-uat12
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 5
              name: mps-citizen-backend
              ports:
                - containerPort: 8081
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              startupProbe:
                failureThreshold: 36
                httpGet:
                  path: /health
                  port: http
                  scheme: HTTP
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  mps-citizen:
    labels:
      app: mps-citizen
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 3
      selector:
        matchLabels:
          app: mps-citizen
      strategy:
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps-citizen
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-citizen-frontend-config
              image: ravinadh/mps-uat:citizen-uat12
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /citizen/
                  port: http
                  scheme: HTTP
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 3
              name: mps-citizen
              ports:
                - containerPort: 80
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /citizen/
                  port: http
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  mps:
    labels:
      app: mps
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: mps
      strategy:
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: mps
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: mps-frontend-secret
              image: ravinadh/mps-uat:mps-uat68
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 80
                  scheme: HTTP
                initialDelaySeconds: 30
                periodSeconds: 20
                successThreshold: 1
                timeoutSeconds: 5
              name: mps
              ports:
                - containerPort: 80
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 80
                  scheme: HTTP
                initialDelaySeconds: 10
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 250m
                  memory: 256Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
ingresses:
  mps-citizen:
    labels:
      app: mps-citizen
    spec:
      ingressClassName: kommander-traefik
      rules:
        - host: mpsuat.portal.gov.gy
          http:
            paths:
              - backend:
                  service:
                    name: mps-citizen-service
                    port:
                      name: http
                path: /citizen
                pathType: Prefix
  mps-ingress:
    spec:
      ingressClassName: kommander-traefik
      rules:
        - host: mpsuat.portal.gov.gy
          http:
            paths:
              - backend:
                  service:
                    name: mps-backend-service
                    port:
                      number: 80
                path: /health
                pathType: Exact
              - backend:
                  service:
                    name: mps-backend-service
                    port:
                      number: 80
                path: /api
                pathType: Prefix
              - backend:
                  service:
                    name: mps-service
                    port:
                      number: 80
                path: /
                pathType: Prefix
services:
  mps-backend-service:
    labels:
      app: mps-backend
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 8081
          protocol: TCP
          targetPort: 8081
      selector:
        app: mps-backend
      sessionAffinity: None
      type: ClusterIP
  mps-citizen-backend-service:
    labels:
      app: mps-citizen-backend
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 8081
          protocol: TCP
          targetPort: http
      selector:
        app: mps-citizen-backend
      sessionAffinity: None
      type: ClusterIP
  mps-citizen-service:
    labels:
      app: mps-citizen
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: http
      selector:
        app: mps-citizen
      sessionAffinity: None
      type: ClusterIP
  mps-postgres:
    labels:
      app: mps-postgres
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: postgres
          port: 5432
          protocol: TCP
          targetPort: 5432
      selector:
        app: mps-postgres
      sessionAffinity: None
      type: ClusterIP
  mps-service:
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 80
      selector:
        app: mps
      sessionAffinity: None
      type: ClusterIP
statefulSets:
  mps-postgres:
    labels:
      app: mps-postgres
    spec:
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
      podManagementPolicy: OrderedReady
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: mps-postgres
      serviceName: mps-postgres
      template:
        metadata:
          labels:
            app: mps-postgres
        spec:
          containers:
            - env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      key: POSTGRES_DB
                      name: mps-postgres-secret
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      key: POSTGRES_USER
                      name: mps-postgres-secret
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: POSTGRES_PASSWORD
                      name: mps-postgres-secret
              image: postgres:16
              imagePullPolicy: IfNotPresent
              livenessProbe:
                exec:
                  command:
                    - sh
                    - -c
                    - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                failureThreshold: 6
                initialDelaySeconds: 30
                periodSeconds: 20
                successThreshold: 1
                timeoutSeconds: 5
              name: postgres
              ports:
                - containerPort: 5432
                  name: postgres
                  protocol: TCP
              readinessProbe:
                exec:
                  command:
                    - sh
                    - -c
                    - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
                failureThreshold: 3
                initialDelaySeconds: 10
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: '1'
                  memory: 1Gi
                requests:
                  cpu: 250m
                  memory: 512Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /var/lib/postgresql/data
                  name: postgres-data
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext:
            fsGroup: 999
          terminationGracePeriodSeconds: 30
      updateStrategy:
        rollingUpdate:
          partition: 0
        type: RollingUpdate
      volumeClaimTemplates:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: postgres-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            volumeMode: Filesystem
          status:
            phase: Pending
