{{- range $name, $o := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  {{- with $o.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $o.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- toYaml $o.data | nindent 2 }}
{{- end }}
