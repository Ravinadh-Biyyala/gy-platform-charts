{{- range $name, $o := .Values.middlewares }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}
  {{- with $o.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $o.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $o.spec | nindent 2 }}
{{- end }}
