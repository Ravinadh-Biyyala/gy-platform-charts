# nis - UAT: namespace react-nis-uat on the UAT cluster
# Recovered from the live namespace; reproduces it exactly (verify with kubectl diff).
# Secrets are NOT here - the pods read existing Secrets by name.
configMaps:
  nis-backend-config:
    labels:
      app: nis-backend
    data:
      API_DOCS_ENABLED: 'false'
      AUTH_MODE: disabled
      BASE_PATHS: /api/v1
      CORS_ORIGINS: https://nisuat.portal.gov.gy,https://customer-agility-7541--nisuat.sandbox.lightning.force.com
      DB_SCHEMA: nis
      DOCUMENTS_SERVICE_URL: https://mayanuat.services.gov.gy
      DOCUMENTS_TIMEOUT_MS: '60000'
      DUPLICATE_CHECK_RATE_LIMIT_MAX: '60'
      DUPLICATE_CHECK_RATE_LIMIT_WINDOW_MS: '60000'
      JSON_BODY_LIMIT: 10mb
      KC_AUDIENCE: ''
      KC_CLIENT_ID: nis-portal
      KC_ISSUER: ''
      KC_NAME_ALLOWED_CHARACTERS: '&()'
      KC_PROVISION_CLIENT_ID: nis-portal
      KC_PROVISION_TIMEOUT_MS: '8000'
      KC_REALM: Guyana-Citizen-uat
      KC_URL: https://keycloakdev.portal.gov.gy
      LOG_FORMAT: json
      LOG_LEVEL: info
      MULE_CASE_INTERVAL_MS: '30000'
      MULE_CASE_URL: https://esbuat.services.gov.gy/api/v1/contributions/case-creation
      MULE_SUPPORT_CASE_INTERVAL_MS: '30000'
      MULE_SUPPORT_CASE_URL: https://esbuat.services.gov.gy/api/v1/case-creation
      MULE_SUPPORT_EMAIL_URL: https://esbuat.services.gov.gy/api/v1/notifications/email
      MULE_TIMEOUT_MS: '15000'
      PG_IDLE_TIMEOUT_MS: '30000'
      PG_POOL_MAX: '10'
      PORT: '8081'
      PROVISION_RATE_LIMIT_MAX: '5'
      PROVISION_RATE_LIMIT_WINDOW_MS: '900000'
      RATE_LIMIT_MAX: '300'
      RATE_LIMIT_WINDOW_MS: '60000'
      SCHEDULE_FILE_CHECK_REQUIRED: 'false'
      SUPPORT_RATE_LIMIT_MAX: '5'
      SUPPORT_RATE_LIMIT_WINDOW_MS: '900000'
deployments:
  nis-backend:
    labels:
      app: nis-backend
    spec:
      progressDeadlineSeconds: 600
      replicas: 2
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: nis-backend
      strategy:
        rollingUpdate:
          maxSurge: 25%
          maxUnavailable: 25%
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: nis-backend
        spec:
          containers:
            - envFrom:
                - configMapRef:
                    name: nis-backend-config
                - secretRef:
                    name: nis-backend-secrets
              image: ravinadh/ksquarenis:nis-backend-uatv54
              imagePullPolicy: Always
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: 8081
                  scheme: HTTP
                periodSeconds: 30
                successThreshold: 1
                timeoutSeconds: 5
              name: nis-backend
              ports:
                - containerPort: 8081
                  name: http
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /health
                  port: 8081
                  scheme: HTTP
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 5
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
              startupProbe:
                failureThreshold: 36
                httpGet:
                  path: /health
                  port: 8081
                  scheme: HTTP
                periodSeconds: 5
                successThreshold: 1
                timeoutSeconds: 1
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  react-nis:
    spec:
      progressDeadlineSeconds: 600
      replicas: 1
      revisionHistoryLimit: 10
      selector:
        matchLabels:
          app: react-nis
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app: react-nis
        spec:
          containers:
            - env:
                - name: ENCRYPTION_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: ENCRYPTION_SECRET
                      name: app-secrets
                - name: AUTHORIZATION_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: AUTHORIZATION_SECRET
                      name: app-secrets
              image: ravinadh/ksquarenis:uatv117
              imagePullPolicy: IfNotPresent
              livenessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 3000
                  scheme: HTTP
                initialDelaySeconds: 30
                periodSeconds: 20
                successThreshold: 1
                timeoutSeconds: 1
              name: react-nis
              ports:
                - containerPort: 3000
                  protocol: TCP
              readinessProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 3000
                  scheme: HTTP
                initialDelaySeconds: 10
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 1
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 250m
                  memory: 256Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              volumeMounts:
                - mountPath: /shared-data
                  name: nis-shared-data
          dnsPolicy: ClusterFirst
          restartPolicy: Always
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
          volumes:
            - name: nis-shared-data
              persistentVolumeClaim:
                claimName: nis-shared-data
ingresses:
  react-nis-ingress:
    spec:
      ingressClassName: kommander-traefik
      rules:
        - host: nisuat.portal.gov.gy
          http:
            paths:
              - backend:
                  service:
                    name: nis-backend-service
                    port:
                      number: 8081
                path: /api
                pathType: Prefix
              - backend:
                  service:
                    name: react-nis-service
                    port:
                      number: 80
                path: /
                pathType: Prefix
      tls:
        - hosts:
            - nisuat.portal.gov.gy
          secretName: nisuat-tls
persistentVolumeClaims:
  nis-shared-data:
    annotations:
      helm.sh/resource-policy: keep
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: nutanix-volume
      volumeMode: Filesystem
services:
  nis-backend-service:
    labels:
      app: nis-backend
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 8081
          protocol: TCP
          targetPort: 8081
      selector:
        app: nis-backend
      sessionAffinity: None
      type: ClusterIP
  react-nis-service:
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 3000
      selector:
        app: react-nis
      sessionAffinity: None
      type: ClusterIP
