namespace: kodi-dev
workloads:
  kodi-api:
    replicas: 1
    api:
      image: ravinadh/kodi-api:dev-511b7d35d368c75afee7e8ac6b4ed820d520e40b
  kodi-ui:
    replicas: 1
    ui:
      image: ravinadh/kodi-ui:dev-c8421768f7873c64898a48480b79f33c0af98765
  kodi-worker:
    replicas: 1
