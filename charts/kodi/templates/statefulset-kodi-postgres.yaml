apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-postgres
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: {{ (index .Values.workloads "kodi-postgres" "replicas") }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kodi-postgres
  serviceName: kodi-postgres
  template:
    metadata:
      labels:
        app: kodi-postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          value: kodi
        - name: POSTGRES_DB
          value: kodi
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: kodi-infra-secrets
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: {{ (index .Values.workloads "kodi-postgres" "postgres" "image") | quote }}
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U kodi -d kodi
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 30
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: nutanix-volume
      volumeMode: Filesystem
    status:
      phase: Pending
