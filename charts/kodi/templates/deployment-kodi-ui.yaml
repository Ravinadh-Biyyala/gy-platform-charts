apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-ui
spec:
  progressDeadlineSeconds: 600
  replicas: {{ (index .Values.workloads "kodi-ui" "replicas") }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: kodi-ui
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kodi-ui
    spec:
      containers:
      - env:
        - name: KODI_API_UPSTREAM
          value: kodi-api.kodi-dev.svc.cluster.local:8000
        - name: KODI_DNS_RESOLVER
          value: 10.96.0.10
        - name: KODI_MAX_UPLOAD
          value: 200m
        image: {{ (index .Values.workloads "kodi-ui" "ui" "image") | quote }}
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: ui
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
