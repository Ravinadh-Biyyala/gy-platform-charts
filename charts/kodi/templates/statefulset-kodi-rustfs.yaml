apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-rustfs
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: {{ (index .Values.workloads "kodi-rustfs" "replicas") }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kodi-rustfs
  serviceName: kodi-rustfs
  template:
    metadata:
      labels:
        app: kodi-rustfs
    spec:
      containers:
      - env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: RUSTFS_ACCESS_KEY
              name: kodi-rustfs-secrets
        - name: RUSTFS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: RUSTFS_SECRET_KEY
              name: kodi-rustfs-secrets
        - name: RUSTFS_CONSOLE_ENABLE
          value: 'false'
        image: {{ (index .Values.workloads "kodi-rustfs" "rustfs" "image") | quote }}
        imagePullPolicy: IfNotPresent
        name: rustfs
        ports:
        - containerPort: 9000
          name: s3
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: rustfs-data
        - mountPath: /logs
          name: rustfs-logs
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - 'mkdir -p /data/rustfs

          chgrp -R 1000 /data

          chmod -R g+rwX /data

          '
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: prepare-storage
        resources: {}
        securityContext:
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: rustfs-data
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: rustfs-logs
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      name: rustfs-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: nutanix-volume
      volumeMode: Filesystem
    status:
      phase: Pending
