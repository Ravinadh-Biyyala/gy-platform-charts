apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-rustfs
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: s3
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: kodi-rustfs
  sessionAffinity: None
  type: ClusterIP
