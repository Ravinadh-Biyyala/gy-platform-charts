apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-rabbitmq
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: amqp
    port: 5672
    protocol: TCP
    targetPort: 5672
  - name: management
    port: 15672
    protocol: TCP
    targetPort: 15672
  selector:
    app: kodi-rabbitmq
  sessionAffinity: None
  type: ClusterIP
