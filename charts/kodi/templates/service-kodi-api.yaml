apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-api
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: kodi-api
  sessionAffinity: None
  type: ClusterIP
