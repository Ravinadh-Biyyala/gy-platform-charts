apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | quote }}
  name: kodi-postgres
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    app: kodi-postgres
  sessionAffinity: None
  type: ClusterIP
