apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/part-of: onecitizen
  name: postgres
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: postgres
    port: 5432
    protocol: TCP
    targetPort: 5432
  selector:
    app: postgres
    app.kubernetes.io/environment: dev
    app.kubernetes.io/part-of: onecitizen
  sessionAffinity: None
  type: ClusterIP
