apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: onecitizen
  name: onecitizen-frontend
spec:
  progressDeadlineSeconds: 600
  replicas: {{ (index .Values.workloads "onecitizen-frontend" "replicas") }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/environment: dev
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: onecitizen
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/environment: dev
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: onecitizen
    spec:
      containers:
      - image: {{ (index .Values.workloads "onecitizen-frontend" "frontend" "image") | quote }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: frontend
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: nginx-cache
      - emptyDir: {}
        name: tmp
