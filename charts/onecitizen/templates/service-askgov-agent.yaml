apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: askgov-agent
    app.kubernetes.io/part-of: onecitizen
  name: askgov-agent
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 4100
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: askgov-agent
    app.kubernetes.io/part-of: onecitizen
  sessionAffinity: None
  type: ClusterIP
