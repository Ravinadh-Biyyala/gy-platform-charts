apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/environment: dev
    app.kubernetes.io/name: askgov-agent
    app.kubernetes.io/part-of: onecitizen
  name: onecitizen-askgov-agent
spec:
  progressDeadlineSeconds: 600
  replicas: {{ (index .Values.workloads "onecitizen-askgov-agent" "replicas") }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/environment: dev
      app.kubernetes.io/name: askgov-agent
      app.kubernetes.io/part-of: onecitizen
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
        app.kubernetes.io/environment: dev
        app.kubernetes.io/name: askgov-agent
        app.kubernetes.io/part-of: onecitizen
    spec:
      containers:
      - env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '4100'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: onecitizen-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: onecitizen-secrets
              optional: true
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              key: TAVILY_API_KEY
              name: onecitizen-secrets
              optional: true
        envFrom:
        - configMapRef:
            name: onecitizen-config
        image: {{ (index .Values.workloads "onecitizen-askgov-agent" "askgov-agent" "image") | quote }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: askgov-agent
        ports:
        - containerPort: 4100
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/appuser
          name: home
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: home
