---
# Source: keycloak-uat/templates/keycloak-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Source: keycloak-uat/templates/postgres-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  namespace: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Source: keycloak-uat/templates/keycloak-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
        - name: keycloak

          image: "quay.io/keycloak/keycloak:26.2"
          imagePullPolicy: IfNotPresent

          args:
            - start

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin-password

            - name: KC_DB
              value: postgres

            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-postgresql:5432/keycloak"

            - name: KC_DB_USERNAME
              value: "keycloak"

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgresql
                  key: password

            - name: KC_HTTP_ENABLED
              value: "true"

            - name: KC_PROXY_HEADERS
              value: "xforwarded"

            - name: KC_HOSTNAME
              value: "keycloakuat.portal.gov.gy"

            - name: KC_HOSTNAME_STRICT
              value: "false"

          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
---
# Source: keycloak-uat/templates/postgres-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgresql
  namespace: keycloak
spec:
  serviceName: keycloak-postgresql
  replicas: 1

  selector:
    matchLabels:
      app: keycloak-postgresql

  template:
    metadata:
      labels:
        app: keycloak-postgresql

    spec:
      containers:
        - name: postgresql
          image: "postgres:16"
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "keycloak"

            - name: POSTGRES_USER
              value: "keycloak"

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgresql
                  key: password

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nutanix-volume
        resources:
          requests:
            storage: 20Gi
---
# Source: keycloak-uat/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: kommander-traefik

  rules:
    - host: keycloakuat.portal.gov.gy
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
