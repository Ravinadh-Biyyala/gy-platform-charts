apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayan-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mayan-beat
  template:
    metadata:
      labels:
        app: mayan-beat
    spec:
      containers:
        - name: mayan-beat
          image: "{{ .Values.mayan.image.repository }}:{{ .Values.mayan.image.tag }}"
          envFrom:
            - configMapRef:
                name: mayan-config
            - secretRef:
                name: mayan-secrets
          volumeMounts:
            - name: media
              mountPath: /var/lib/mayan
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mayan-media
