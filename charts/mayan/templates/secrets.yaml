apiVersion: v1
kind: Secret
metadata:
  name: mayan-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.secrets.djangoSecretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan','USER':'mayan','PASSWORD':'{{ .Values.secrets.postgresPassword }}','HOST':'mayan-postgres','PORT':'5432'}}"
  MAYAN_CELERY_BROKER_URL: "amqp://mayan:{{ .Values.secrets.rabbitmqPassword }}@mayan-rabbitmq:5672/mayan"
