apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mayan-rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.rabbitmq.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.rabbitmq.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mayan-rabbitmq
spec:
  serviceName: mayan-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: mayan-rabbitmq
  template:
    metadata:
      labels:
        app: mayan-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: mayan
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: mayan-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_DEFAULT_VHOST
              value: mayan
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mayan-rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: mayan-rabbitmq
spec:
  selector:
    app: mayan-rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: mgmt
      port: 15672
