{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mayan-app-ingress-only-from-traefik
spec:
  podSelector:
    matchLabels:
      app: mayan-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.traefik.namespace | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mayan-backing-services-internal-only
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [mayan-postgres,mayan-rabbitmq,mayan-redis]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [mayan-app,mayan-worker,mayan-beat]
{{- end }}
