apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayan-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mayan-worker
  template:
    metadata:
      labels:
        app: mayan-worker
    spec:
      nodeSelector:
        mayan-media-node: "true"
      containers:
        - name: mayan-worker
          image: "{{ .Values.mayan.image.repository }}:{{ .Values.mayan.image.tag }}"
          envFrom:
            - configMapRef:
                name: mayan-config
            - secretRef:
                name: mayan-secrets
          volumeMounts:
            - name: media
              mountPath: /var/lib/mayan
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mayan-media
