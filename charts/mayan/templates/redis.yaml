apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayan-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mayan-redis
  template:
    metadata:
      labels:
        app: mayan-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: mayan-redis
spec:
  selector:
    app: mayan-redis
  ports:
    - port: 6379
      targetPort: 6379
