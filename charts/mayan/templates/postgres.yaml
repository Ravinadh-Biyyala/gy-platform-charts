apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mayan-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.postgres.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mayan-postgres
spec:
  serviceName: mayan-postgres
  replicas: 1
  selector:
    matchLabels:
      app: mayan-postgres
  template:
    metadata:
      labels:
        app: mayan-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mayan
            - name: POSTGRES_USER
              value: mayan
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mayan-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mayan-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: mayan-postgres
spec:
  clusterIP: None
  selector:
    app: mayan-postgres
  ports:
    - port: 5432
      targetPort: 5432
