apiVersion: apps/v1
kind: Deployment
metadata:
  name: mayan-app
spec:
  replicas: {{ .Values.mayan.replicas }}
  selector:
    matchLabels:
      app: mayan-app
  template:
    metadata:
      labels:
        app: mayan-app
    spec:
      containers:
        - name: mayan-app
          image: "{{ .Values.mayan.image.repository }}:{{ .Values.mayan.image.tag }}"
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mayan-secrets
            - configMapRef:
                name: mayan-config
            - secretRef:
                name: mayan-secrets
          volumeMounts:
            - name: media
              mountPath: /var/lib/mayan
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: mayan-media
---
apiVersion: v1
kind: Service
metadata:
  name: mayan-app
spec:
  selector:
    app: mayan-app
  ports:
    - port: 8000
      targetPort: 8000
